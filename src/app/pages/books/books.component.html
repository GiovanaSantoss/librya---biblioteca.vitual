<div class="books-container">
  <h1 class="page-title">LIBRYA</h1>
  <p class="page-subtitle">Navegue pelos títulos disponíveis.</p>

  <div class="books-classes">
    <h2>TO BE READ</h2>
    <div class="books-grid" *ngIf="toBeReadList.length > 0; else noBooks">
      <div class="book-card" *ngFor="let book of toBeReadList">
        <img class="book-cover" [src]="book.coverImage" [alt]="'Capa do livro ' + book.title" />
        <div class="book-info">
          <h3 class="book-title">{{ book.title }}</h3>
          <p class="book-author">{{ book.author }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="books-classes">
    <h2>LENDO</h2>
    <div class="books-grid" *ngIf="readingList.length > 0; else noBooks">
      <div class="book-card" *ngFor="let book of readingList">
        <img class="book-cover" [src]="book.coverImage" [alt]="'Capa do livro ' + book.title" />
        <div class="book-info">
          <h3 class="book-title">{{ book.title }}</h3>
          <p class="book-author">{{ book.author }}</p>
        </div>
      </div>
    </div>
  </div>

  <div class="books-classes">
    <h2>LIDOS</h2>
    <div class="books-grid" *ngIf="readList.length > 0; else noBooks">
      <div class="book-card" *ngFor="let book of readList">
        <img class="book-cover" [src]="book.coverImage" [alt]="'Capa do livro ' + book.title" />
        <div class="book-info">
          <h3 class="book-title">{{ book.title }}</h3>
          <p class="book-author">{{ book.author }}</p>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noBooks>
    <p>Nenhum livro encontrado no momento.</p>
  </ng-template>
</div>
